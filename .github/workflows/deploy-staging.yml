name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:          
          dotnet-version: '6.0.x'

      - name: Build
        run: dotnet build --configuration Release
        working-directory: TrailBlazers.Qualtrics.SurveyResponseDataIntegration/TrailBlazers.Qualtrics.SurveyDataIntegration

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish
        working-directory: TrailBlazers.Qualtrics.SurveyResponseDataIntegration/TrailBlazers.Qualtrics.SurveyDataIntegration

      - name: Deploy to Azure Staging
        uses: Azure/functions-action@v1
        with:
          app-name: func-dw-qualtrics-survey-integration
          slot-name: staging
          package: TrailBlazers.Qualtrics.SurveyResponseDataIntegration/TrailBlazers.Qualtrics.SurveyDataIntegration/publish
          publish-profile: ${{ secrets.AZURE_FUNC_DW_QUALTRICS_PUBLISH_PROFILE_STAGING }}